name: Diamond Car Auction CI
on:
  push:
    paths: ['diamond-car-auction/**', '.github/workflows/diamond-car-auction.yml']
  pull_request:
    paths: ['diamond-car-auction/**', '.github/workflows/diamond-car-auction.yml']
defaults:
  run:
    working-directory: diamond-car-auction
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: diamond-car-auction/**/pom.xml
      - run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diamond-car-auction/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: diamond-car-auction/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: diamond-car-auction/frontend/package-lock.json
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: npm ci
        working-directory: diamond-car-auction/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: diamond-car-auction/frontend
      - run: npm run e2e
        working-directory: diamond-car-auction/frontend
      - run: node scripts/demo.mjs --recovery
      - if: failure()
        run: docker compose logs --tail 150
