name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - run: |
          mkdir ci-jars
          cp {users,auctions,orders,notifications,gateway}/target/*-1.0.0.jar ci-jars/
      - uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: ci-jars/*.jar
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    needs: backend
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: ci-jars
      - run: docker compose up --build -d --wait --wait-timeout 300
        env:
          JAVA_IMAGE_TARGET: prebuilt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - run: node scripts/demo.mjs --recovery
      - if: failure()
        run: docker compose logs --tail 150
