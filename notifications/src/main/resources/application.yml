spring:
  application.name: notifications
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notifications
    username: notifications
    password: ${DB_PASSWORD}
  lifecycle.timeout-per-shutdown-phase: 20s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:diamond}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template.mandatory: true
    listener.simple:
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 4
        initial-interval: 500ms
        multiplier: 2
        max-interval: 5s
  data.redis.host: ${REDIS_HOST:localhost}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties.mail.smtp:
      connectiontimeout: 3000
      timeout: 3000
      writetimeout: 3000
server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: ${TRACE_SAMPLE:1.0}
  zipkin.tracing.endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
logging.structured.format.console: logstash
diamond:
  jwt-secret: ${JWT_SECRET}
  internal-secret: ${INTERNAL_SECRET}
  currency: ${AUCTION_CURRENCY:USD}
  origin: ${APP_ORIGIN:http://localhost:8080}
  secure-cookies: ${SECURE_COOKIES:true}
  users-url: ${USERS_URL:http://localhost:8080}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    user: ${MINIO_ROOT_USER:diamond-storage}
    password: ${MINIO_ROOT_PASSWORD:diamond-local-storage}
spring.servlet.multipart:
  max-file-size: 8MB
  max-request-size: 9MB
